# A variable makes nginx re-resolve the app through Docker DNS, so a recreated app container
# (new IP after a deploy) is found without reloading nginx.
set $app_upstream http://app:8080;
proxy_pass $app_upstream;
# Fail fast while the app restarts during a deploy.
proxy_connect_timeout 5s;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwrite instead of append so a client cannot inject its own address.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
