# Shared by the HTTP-only and HTTPS server blocks.
root /usr/share/nginx/html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SEC-12: no inline scripts. Inline style attributes are allowed for React style props.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# SPA: unknown paths fall back to index.html, which must not be cached.
location / {
    try_files $uri /index.html;
}
location = /index.html {
    expires -1;
}
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}
location /oauth2/ {
    limit_req zone=login burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}
location /login/ {
    limit_req zone=login burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}
location /ws {
    limit_conn ws 100;
    include /etc/nginx/snippets/proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
}

# SEC-10: only health leaves the server.
location = /actuator/health {
    include /etc/nginx/snippets/proxy.conf;
}
location /actuator {
    return 404;
}

# Errors nginx produces itself use the API error format (docs/API.md §0).
error_page 429 @rate_limited;
error_page 413 @too_large;
error_page 502 503 504 =502 @unavailable;
location @rate_limited {
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"요청이 너무 많아요. 잠시 후 다시 시도해 주세요."}}';
}
location @too_large {
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"낙서가 너무 커요."}}';
}
location @unavailable {
    default_type application/json;
    return 502 '{"error":{"code":"INTERNAL","message":"일시적인 오류가 발생했어요."}}';
}
