user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # SEC-13: $uri carries no query string, so OAuth codes and states never reach the access log.
    log_format  main  '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/css application/javascript application/json image/svg+xml;

    # Above the app's 2MB doodle limit (D-30) so the app answers 413 in the API format itself.
    client_max_body_size 3m;

    # Per-IP limits (SEC-08, SEC-09). Values are documented in docs/ARCHITECTURE.md §7.
    limit_req_zone   $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone   $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone  $binary_remote_addr zone=ws:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Docker's embedded DNS; see proxy.conf.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
